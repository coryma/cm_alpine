<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">明亮日常健康角落</title>
  <desc id="desc">帶有陽光、柑橘、水壺與葉片的健康日常角落插圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="100%" stop-color="#e6f2e2"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff4be" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#fff4be" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" x2="1">
      <stop offset="0%" stop-color="#d5b898"/>
      <stop offset="100%" stop-color="#b98c64"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f4e8d7" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8acd86"/>
      <stop offset="100%" stop-color="#4f9468"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9eb199" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>
  <rect width="1000" height="800" fill="url(#sun)"/>

