<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">明亮健康補給主視覺</title>
  <desc id="desc">以穀物碗、柑橘、機能飲與葉片構成的健康生活風格插圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f3e8"/>
      <stop offset="45%" stop-color="#eef8eb"/>
      <stop offset="100%" stop-color="#dff0d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="70%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#fff7c8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#fff7c8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff7c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f5ead7" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8bcf8a"/>
      <stop offset="100%" stop-color="#4e8d61"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7fcf93"/>
      <stop offset="100%" stop-color="#2f8a5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#96af8d" flood-opacity="0.22"/>
    </filter>
  </defs>

