<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">午後充電角落</title>
  <desc id="desc">帶有咖啡杯、能量補給與暖橘色調的午後充電角落插圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fdf0e0"/>
      <stop offset="100%" stop-color="#f5e6d0"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe0a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" x2="1">
      <stop offset="0%" stop-color="#c4a07a"/>
      <stop offset="100%" stop-color="#a8845c"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0e0c8" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8944a"/>
      <stop offset="100%" stop-color="#d47832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b89878" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>
  <rect width="1000" height="800" fill="url(#warmGlow)"/>

  <circle cx="680" cy="160" r="140" fill="#ffe8b8" opacity="0.6"/>
  <circle cx="200" cy="620" r="160" fill="#f5dcc0" opacity="0.5"/>

  <rect x="112" y="448" width="776" height="22" rx="11" fill="url(#shelf)"/>
  <rect x="156" y="610" width="698" height="24" rx="12" fill="#b89070"/>

  <!-- Coffee cup -->
  <g filter="url(#shadow)">
    <ellipse cx="340" cy="430" rx="100" ry="24" fill="#c09060" opacity="0.2"/>
    <rect x="260" y="280" width="160" height="168" rx="32" fill="url(#cup)"/>
    <ellipse cx="340" cy="280" rx="80" ry="22" fill="#ffffff"/>
    <ellipse cx="340" cy="280" rx="64" ry="16" fill="#8b5e3c"/>
    <ellipse cx="340" cy="276" rx="52" ry="12" fill="#a06e44"/>
    <path d="M420 320c40 4 60 28 56 64-4 34-30 52-56 48" fill="none" stroke="#d0b090" stroke-width="12" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M310 258c-4-30 12-48 8-72" fill="none" stroke="#e8dcd0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M340 252c0-28 14-46 6-74" fill="none" stroke="#e8dcd0" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M370 258c4-32-10-50-4-70" fill="none" stroke="#e8dcd0" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Energy bar -->
  <g filter="url(#shadow)">
    <rect x="560" y="320" width="200" height="80" rx="16" fill="url(#accent)"/>
    <rect x="580" y="340" width="80" height="40" rx="8" fill="#fff4e0" opacity="0.9"/>
    <rect x="670" y="348" width="70" height="8" rx="4" fill="#fff4e0" opacity="0.6"/>
    <rect x="670" y="364" width="50" height="8" rx="4" fill="#fff4e0" opacity="0.4"/>
  </g>

  <!-- Protein shaker -->
  <g filter="url(#shadow)">
    <rect x="180" y="480" width="100" height="140" rx="22" fill="#e8e0d4"/>
    <rect x="196" y="460" width="68" height="30" rx="12" fill="#c0a888"/>
    <rect x="198" y="540" width="64" height="50" rx="10" fill="url(#accent)" opacity="0.7"/>
    <circle cx="230" cy="565" r="14" fill="#fff4e0" opacity="0.8"/>
  </g>

  <!-- Fruit bowl -->
  <g filter="url(#shadow)">
    <ellipse cx="660" cy="600" rx="120" ry="30" fill="#c09060" opacity="0.2"/>
    <ellipse cx="660" cy="572" rx="110" ry="76" fill="#f8f0e4"/>
    <ellipse cx="660" cy="560" rx="90" ry="58" fill="#ede0d0"/>
    <circle cx="630" cy="540" r="28" fill="#e8944a"/>
    <circle cx="680" cy="530" r="24" fill="#f0a050"/>
    <circle cx="660" cy="570" r="22" fill="#e08840"/>
    <path d="M580 580c24 56 80 90 148 90 66 0 120-30 144-82-28 68-100 118-186 118-88 0-162-52-186-126 22 6 50 6 80 0z" fill="#8a6e50"/>
  </g>

  <!-- Decorative leaves -->
  <g fill="url(#accent)" opacity="0.5">
    <path d="M820 500c-50 14-86 52-104 108 58-12 98-46 116-96 4-14-2-18-12-12z"/>
    <path d="M140 430c48-28 98-26 148 8-42 32-96 36-156 18 0-10 2-18 8-26z"/>
  </g>
</svg>
